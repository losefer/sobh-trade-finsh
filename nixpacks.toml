[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@10",
  "export PATH=\"$(npm root -g)/.bin:$PATH\" && pnpm install --frozen-lockfile --ignore-scripts"
]

[phases.build]
cmds = [
  "export PATH=\"$(npm root -g)/.bin:$PATH\" && pnpm --filter @workspace/attendance run build",
  "export PATH=\"$(npm root -g)/.bin:$PATH\" && pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"